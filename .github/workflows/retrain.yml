name: Retrain

on:
  workflow_dispatch:
    inputs:
      data_url:
        description: "CSV URL with the same columns as the training data (empty = default dataset)"
        required: false
        default: ""

jobs:
  retrain:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Retrain, compare and decide
        env:
          DATA_URL_INPUT: ${{ github.event.inputs.data_url }}
        run: |
          if [ -n "$DATA_URL_INPUT" ]; then
            python src/retrain.py --data "$DATA_URL_INPUT" --out candidate --promote
          else
            python src/retrain.py --out candidate --promote
          fi
          cat candidate/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Push a review branch if the candidate was promoted
        run: |
          if [ -n "$(git status --porcelain models metrics.json)" ]; then
            BRANCH="retrain/run-${GITHUB_RUN_ID}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add models metrics.json
            git commit -m "Retrained model (run ${GITHUB_RUN_ID}), passed promotion gate"
            git push origin "$BRANCH"
            echo "Review branch pushed: $BRANCH. Open a pull request and merge it to promote the model." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No model change to promote." >> "$GITHUB_STEP_SUMMARY"
          fi
