name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -v

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t churnguard:ci .
      - name: Run container and check health
        run: |
          docker run -d -p 8000:8000 --name cg churnguard:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/; then echo; exit 0; fi
            sleep 2
          done
          docker logs cg
          exit 1
