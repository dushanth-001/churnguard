
data:
  test_size: 0.30
  val_test_split: 0.50
  random_state: 42

model:
  n_estimators: [100, 200, 300]
  max_depth: [3, 5, 7, 10]
  learning_rate: [0.01, 0.05, 0.1, 0.2]
  subsample: [0.7, 0.8, 0.9, 1.0]

tuning:
  n_iter: 20
  cv_folds: 3
  scoring: recall

paths:
  model_save_path: "models/xgboost_model.pkl"
  log_path: "logs/app.log"
